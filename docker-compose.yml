services:
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      HRA_QDRANT_LOCATION: http://qdrant:6333
    depends_on: [qdrant]

volumes:
  qdrant_data:
